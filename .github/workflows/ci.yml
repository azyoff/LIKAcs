name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax, unit tests, VAC-safety guard
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile all sources
        run: python -m compileall -q src scripts tests
      - name: VAC-safety static guard
        run: python scripts/verify_vac_safety.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Headless self-test
        run: python -m likacs --self-test
      - name: Generate icon asset
        run: python scripts/make_icon.py

  windows-build:
    name: Standalone Windows .exe smoke build
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build toolchain
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: VAC-safety static guard
        run: python scripts/verify_vac_safety.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify Windows GUI imports (ctypes / wintypes / Tkinter)
        run: python -c "import likacs.tray; from likacs.ui import theme, widgets, about, mode_chooser, control_center, station_agent, smoke; print('Windows GUI imports OK')"
      - name: Render every GUI window against a real Tk root
        run: python scripts/smoke_gui.py
      - name: Headless self-test
        run: python -m likacs --self-test
      - name: Build unified LIKAcs.exe
        run: python scripts/build.py --quick
      - name: Run self-test inside the built .exe
        run: |
          $p = Start-Process -FilePath ".\dist\LIKAcs.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Render every GUI window inside the built .exe
        run: |
          $p = Start-Process -FilePath ".\dist\LIKAcs.exe" -ArgumentList "--smoke-gui" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke failed with exit code $($p.ExitCode)" }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIKAcs-windows-smoke
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
