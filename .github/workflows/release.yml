name: Build & Release LIKAcs Windows .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  release:
    name: Build 3 standalone exes and attach to GitHub Release
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller (build time only)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: VAC-safety static guard
        run: python scripts/verify_vac_safety.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Headless self-test
        run: python -m likacs --self-test

      # Windows-only regression guard: importing likacs.tray executes its
      # ctypes.windll/wintypes block. A missing wintypes attribute (HCURSOR)
      # previously crashed every GUI .exe at startup while headless checks
      # stayed green. This step fails the release before any .exe is published.
      - name: Verify Windows GUI imports (ctypes / wintypes / Tkinter)
        run: python -c "import likacs.tray; from likacs.ui import theme, widgets, about, mode_chooser, control_center, station_agent, smoke; print('Windows GUI imports OK')"

      # Import checks alone are not enough: Tk parses option-database font
      # strings only when a widget is created. v1.0.1 passed every import
      # check and still crashed on the first ttk.Label. Build all four real
      # windows here, and again inside the frozen .exe below.
      - name: Render every GUI window against a real Tk root
        run: python scripts/smoke_gui.py

      - name: Build standalone Windows executables
        run: python scripts/build.py

      # --windowed exes have no console. Start-Process -Wait -PassThru plus an
      # explicit ExitCode check guarantees the check really ran; a bare
      # ".\dist\LIKAcs.exe ..." can return immediately for a GUI subsystem app.
      - name: Verify the built unified .exe
        run: |
          $p = Start-Process -FilePath ".\dist\LIKAcs.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Render every GUI window inside the built .exe
        run: |
          $p = Start-Process -FilePath ".\dist\LIKAcs.exe" -ArgumentList "--smoke-gui" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke failed with exit code $($p.ExitCode)" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIKAcs-windows-release
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release (one exe for everything)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: LIKAcs ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## ⬇️ Install: download **`LIKAcs.exe`**

            **One file for everything.** On the owner's laptop run it and choose
            **Open Control Center**; copy the same file to every gaming PC, run it
            and choose **Start Station Agent**. No installer, no Python, no Steam
            on the laptop. If Windows SmartScreen warns about a new build, click
            **More info → Run anyway** (verify with `SHA256SUMS.txt` if unsure).

            The optional `LIKAcs-ControlCenter.exe` / `LIKAcs-StationAgent.exe`
            one-click shortcuts are still built and available in the workflow
            artifact, but are not attached here to keep it simple.

            > ⚠️ **`v1`** (tray `wintypes.HCURSOR` import crash) and
            > **`v1.0.1`** (unbraced `Segoe UI 10` font) are broken — do not
            > download them. This build is verified by a real Tk render of all
            > four windows, both from source and inside the built .exe.
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: |
            dist/SHA256SUMS.txt
            dist/LIKAcs.exe
            README.md
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
