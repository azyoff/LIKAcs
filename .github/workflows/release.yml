name: Build & Release LIKAcs Windows .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build 3 standalone exes and attach to GitHub Release
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller (build time only)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: VAC-safety static guard
        run: python scripts/verify_vac_safety.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Headless self-test
        run: python -m likacs --self-test

      - name: Build standalone Windows executables
        run: python scripts/build.py

      - name: Verify the built unified .exe
        run: .\dist\LIKAcs.exe --self-test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIKAcs-windows-release
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release with all .exe files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: LIKAcs ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/SHA256SUMS.txt
            dist/LIKAcs.exe
            dist/LIKAcs-ControlCenter.exe
            dist/LIKAcs-StationAgent.exe
            README.md
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
